<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>403 - Restricted Access</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 25px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .code {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .input {
            width: 100%;
            height: 46px;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
        }

        .input:focus {
            border-color: #555;
        }

        .button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 7px;
            background: #222;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        .button:hover {
            opacity: .9;
        }

        .error {
            min-height: 20px;
            margin-top: 12px;
            color: #d33;
            font-size: 13px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

    </style>

</head>

<body>

    <main class="container">

        <div class="card">

            <div class="code">403</div>

            <h1>Restricted Access</h1>

            <p class="description">
                This page is protected.
                Enter the password to continue.
            </p>

            <form id="passwordForm">

                <input
                    type="password"
                    id="passwordInput"
                    class="input"
                    placeholder="Enter password"
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="button">
                    Continue
                </button>

            </form>

            <div
                id="passwordError"
                class="error">
            </div>

            <div class="footer">
                Protected Area
            </div>

        </div>

    </main>

    <script src="/external/js/security/protect.js"></script>

</body>
</html>
