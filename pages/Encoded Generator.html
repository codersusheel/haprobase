<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Script & Code Encoder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f6f9;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
    }
    button {
      margin-top: 15px;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .output-group {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Script Tag Encoder Tool</h2>
  
  <label for="inputCode">Apna Code ya Link yahan daalein:</label>
  <textarea id="inputCode" placeholder='<script src="/assets/js/bundle.js"></script>'></textarea>
  
  <button onclick="encodeCode()">Encode Karein</button>

  <div class="output-group">
    <label for="outputCode">Generated HTML Code (Copy & Paste me use karein):</label>
    <textarea id="outputCode" readonly></textarea>
  </div>
</div>

<script>
  function encodeCode() {
    const input = document.getElementById("inputCode").value;
    if (!input.trim()) {
      alert("Kripya pehle kuch text ya link daalein!");
      return;
    }
    
    // Base64 encoding
    const encoded = btoa(unescape(encodeURIComponent(input)));
    
    // Output HTML snippet generate karna
    const result = `<script>\n  document.write(atob("${encoded}"));\n<\/script>`;
    
    document.getElementById("outputCode").value = result;
  }
</script>

</body>
</html>
