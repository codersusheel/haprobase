<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow, noarchive"
    >

    <title>403 Forbidden</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: #050505;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            text-align: center;
        }

        .error {
            width: 100%;
            max-width: 620px;
        }

        .code {
            margin: 0;

            font-size: clamp(
                100px,
                22vw,
                180px
            );

            line-height: .85;

            font-weight: 900;

            letter-spacing: -8px;

            user-select: none;
        }

        .line {
            width: 60px;
            height: 3px;

            margin: 30px auto;

            background: #ffffff;
        }

        h1 {
            margin: 0 0 14px;

            font-size: clamp(
                26px,
                5vw,
                38px
            );

            font-weight: 800;
        }

        p {
            margin: 0 auto;

            max-width: 500px;

            font-size: 15px;

            line-height: 1.7;

            color:
                rgba(255, 255, 255, .6);
        }

        .status {
            display: inline-block;

            margin-top: 25px;

            padding: 7px 13px;

            border: 1px solid
                rgba(255, 255, 255, .15);

            border-radius: 999px;

            font-size: 11px;

            letter-spacing: .7px;

            color:
                rgba(255, 255, 255, .45);
        }

        .actions {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 130px;

            padding: 11px 20px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition:
                opacity .2s ease,
                transform .2s ease;
        }

        .home {
            background: #ffffff;

            color: #000000;

            border: 1px solid #ffffff;
        }

        .refresh {
            background: transparent;

            color: #ffffff;

            border: 1px solid
                rgba(255, 255, 255, .2);
        }

        .btn:hover {
            opacity: .85;

            transform:
                translateY(-1px);
        }


        /* =================================
           BLOCKED / SUSPICIOUS STATE
           ================================= */

        body.protected .home {
            display: none;
        }


        /* =================================
           MOBILE
           ================================= */

        @media (max-width: 480px) {

            body {
                padding: 20px;
            }

            .code {
                letter-spacing: -4px;
            }

            p {
                font-size: 14px;
            }

            .actions {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <main class="error">

        <div
            class="code"
            aria-label="403"
        >
            403
        </div>


        <div class="line"></div>


        <h1>
            Access Denied
        </h1>


        <p>
            You don't have permission to access this resource.
            The requested page is protected or unavailable.
        </p>


        <div class="status">
            ACCESS DENIED
        </div>


        <div class="actions">

            <a
                class="btn home"
                href="/"
            >
                Return to Home
            </a>


            <button
                class="btn refresh"
                type="button"
                onclick="location.reload()"
            >
                Refresh Page
            </button>

        </div>

    </main>


    <script>

        "use strict";


        /* =================================
           SECURITY STATE
           ================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const blockedByURL =
            params.get("blocked") === "1";


        const blockedFromSession =
            sessionStorage.getItem(
                "page_protection_blocked"
            ) === "1";


        /*
         * If protection redirected the user
         * here, permanently keep this page
         * in protected state for this tab.
         */

        if (
            blockedByURL ||
            blockedFromSession
        ) {

            sessionStorage.setItem(
                "page_protection_blocked",
                "1"
            );

            document.body.classList.add(
                "protected"
            );

        }


        /* =================================
           CONSOLE SECURITY MESSAGE
           ================================= */

        if (
            blockedByURL ||
            blockedFromSession
        ) {

            console.warn(
                "%c403 ACCESS DENIED",
                "color:red;font-size:22px;font-weight:bold;"
            );

            console.warn(
                "Protected page access was blocked."
            );

            console.warn(
                "Security state: ACTIVE"
            );

        } else {

            console.info(
                "%c403 Forbidden",
                "font-size:18px;font-weight:bold;"
            );

        }


        /* =================================
           PROTECTION INFORMATION
           ================================= */

        Object.freeze({
            blocked: true,
            page: "403"
        });

    </script>

</body>

</html>
